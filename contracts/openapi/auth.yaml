openapi: 3.0.3
info:
  title: matcha auth
  version: 0.1.0
  description: |
    Accounts, sign-in and the tokens other services verify.

    Errors use one shape everywhere, `application/problem+json` (RFC 9457). Sign-in and password
    reset never reveal whether an account exists.
servers:
  - url: http://localhost:8080
    description: Local cluster, through Traefik
# Every auth endpoint is public: it's where tokens come from.
security: []
tags:
  - name: accounts
    description: Registration, verification, password reset
  - name: sessions
    description: Sign-in, token refresh, sign-out
  - name: keys
    description: Public keys for verifying access tokens
  - name: health
    description: Liveness for Kubernetes

paths:
  /api/auth/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: The service is up
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/signup:
    post:
      operationId: signup
      tags: [accounts]
      summary: Create an account
      description: The account stays unverified until the link sent by email is opened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Created; a verification email is on its way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          description: The email or the username is already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/verification:
    post:
      operationId: verifyEmail
      tags: [accounts]
      summary: Verify an account with the token from its email link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Verified
        "400":
          description: The token is unknown, expired or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/verification/resend:
    post:
      operationId: resendVerification
      tags: [accounts]
      summary: Send a new verification link
      description: The previous link stops working. The answer is the same whether or not the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Invalid"

  /api/auth/login:
    post:
      operationId: login
      tags: [sessions]
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          description: Wrong username or password; the message never says which
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Right password, but the account isn't verified yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/refresh:
    post:
      operationId: refresh
      tags: [sessions]
      summary: Trade the refresh cookie for new tokens
      description: The refresh token is single-use; presenting a used one ends that session.
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: New tokens
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          description: Missing, expired, revoked or reused refresh token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/logout:
    post:
      operationId: logout
      tags: [sessions]
      summary: End this session
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Signed out; the cookie is cleared
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  /api/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [accounts]
      summary: Email a password reset link
      description: The answer is the same whether or not the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Invalid"

  /api/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [accounts]
      summary: Set a new password with the token from the reset link
      description: Every session of the account is ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid fields, a refused password, or an unknown, expired or used token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [keys]
      summary: Public keys that verify access tokens
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"

components:
  parameters:
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      schema:
        type: string

  headers:
    RefreshCookie:
      description: "`refresh_token`, HttpOnly, SameSite=Strict, scoped to /api/auth"
      schema:
        type: string

  responses:
    Invalid:
      description: A field breaks its rule; `errors` says which
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
    Username:
      type: string
      pattern: "^[A-Za-z0-9_.]{3,20}$"
      description: 3 to 20 characters among letters, digits, `_` and `.`; unique ignoring case
    Name:
      type: string
      minLength: 1
      maxLength: 50
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: At least 12 characters; the server also refuses dictionary words and common passwords

    SignupRequest:
      type: object
      required: [email, username, firstName, lastName, password]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/Email" }
        username: { $ref: "#/components/schemas/Username" }
        firstName: { $ref: "#/components/schemas/Name" }
        lastName: { $ref: "#/components/schemas/Name" }
        password: { $ref: "#/components/schemas/Password" }

    Account:
      type: object
      required: [id, email, username, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: "#/components/schemas/Email" }
        username: { $ref: "#/components/schemas/Username" }
        firstName: { $ref: "#/components/schemas/Name" }
        lastName: { $ref: "#/components/schemas/Name" }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 20 }
        password: { type: string, maxLength: 128 }

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 100 }

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/Email" }

    PasswordResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 100 }
        password: { $ref: "#/components/schemas/Password" }

    Tokens:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: RS256 JWT; every service verifies it with the keys from `/api/auth/.well-known/jwks.json`
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds until the access token expires

    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, n, e]
            properties:
              kty: { type: string, enum: [RSA] }
              kid: { type: string }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [RS256] }
              n: { type: string }
              e: { type: string }

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type:
          {
            type: string,
            description: "A URI naming the kind of problem, e.g. `about:blank`",
          }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          description: One entry per field that breaks its rule
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: username }
              message: { type: string }
