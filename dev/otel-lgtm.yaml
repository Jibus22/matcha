apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# OTLP collector, Prometheus, Tempo, Loki and Grafana in one image. No volume: telemetry resets
# with the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.38.0
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          # Tilt turns green once Grafana answers
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 5
---
# Services send OTLP to otel-lgtm.observability:4317 (gRPC) or :4318 (HTTP).
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: observability
spec:
  selector:
    app: otel-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
