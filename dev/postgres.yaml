apiVersion: v1
kind: Namespace
metadata:
  name: matcha
---
# One Postgres for every service; each service gets its own database and role when it lands.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matcha-pg
  namespace: matcha
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:18.6-3.6.4-standard-trixie
  storage:
    size: 1Gi
  # One login per service, created and kept in sync by the operator.
  managed:
    roles:
      - name: auth
        ensure: present
        login: true
        passwordSecret:
          name: auth-db
---
# auth's database, owned by its login.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: auth
  namespace: matcha
spec:
  name: auth
  owner: auth
  cluster:
    name: matcha-pg
---
# Local development only: a fake password, committed on purpose. Real ones come from a secret
# store in staging and prod.
apiVersion: v1
kind: Secret
metadata:
  name: auth-db
  namespace: matcha
type: kubernetes.io/basic-auth
stringData:
  username: auth
  password: auth-local-dev
