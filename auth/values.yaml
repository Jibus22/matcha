# auth, deployed with the shared chart in charts/service.
image: matcha-auth
pathPrefix: /api/auth
healthPath: /api/auth/health
# The standard Postgres variables: the driver reads them as they are.
env:
  PGHOST: matcha-pg-rw
  PGDATABASE: auth
  PGUSER: auth
secretEnv:
  PGPASSWORD: { secret: auth-db, key: password }
