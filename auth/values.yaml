# auth, deployed with the shared chart in charts/service.
image: matcha-auth
pathPrefix: /api/auth
healthPath: /api/auth/health
# The standard Postgres variables: the driver reads them as they are.
env:
  PGHOST: matcha-pg-rw
  PGDATABASE: auth
  PGUSER: auth
  PUBLIC_URL: http://localhost:8080
  SMTP_ADDR: mailpit:1025
  MAIL_FROM: matcha <no-reply@matcha.local>
secretEnv:
  PGPASSWORD: { secret: auth-db, key: password }
rateLimit:
  paths: [/api/auth/login, /api/auth/password-reset]
